<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0ea5e9" />
    <meta name="description" content="一款帮助学习英语的离线应用程序" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="英语助手" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>英语自学助手</title>
    <style>
      /* 启动页遮罩：由 Capacitor 原生启动图接管前的兜底，避免白屏闪烁 */
      #boot-mask {
        position: fixed;
        inset: 0;
        background: #f0f9ff;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: opacity 0.25s ease;
      }
      #boot-mask.hidden {
        opacity: 0;
        pointer-events: none;
      }
      @media (prefers-color-scheme: dark) {
        #boot-mask {
          background: #0f172a;
        }
        #boot-mask > div {
          color: #38bdf8 !important;
        }
      }
    </style>
  </head>
  <body
    class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 antialiased selection:bg-brand-500 selection:text-white"
  >
    <div id="boot-mask">
      <div style="font-size: 15px; color: #0284c7; letter-spacing: 1px">
        英语自学助手
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
    <script>
      // 注册 Service Worker（仅 Web 部署时需要；安卓包内资源已是本地的，
      // 启用 SW 反而会导致升级安装后仍加载旧版本缓存，故在原生环境跳过）
      var inNativeApp = !!window.Capacitor;
      if ('serviceWorker' in navigator && !inNativeApp) {
        window.addEventListener('load', function () {
          navigator.serviceWorker
            .register('./sw.js')
            .catch(function (err) {
              console.log('SW registration skipped:', err);
            });
        });
      }
      // 首屏渲染完成后移除启动遮罩
      window.addEventListener('load', function () {
        setTimeout(function () {
          var m = document.getElementById('boot-mask');
          if (m) {
            m.classList.add('hidden');
            setTimeout(function () {
              m.remove();
            }, 300);
          }
        }, 120);
      });
    </script>
  </body>
</html>
